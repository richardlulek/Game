[package]
name = "property-empire"
version = "2.0.0"
description = "Property Empire"
authors = ["Richard Lulek"]
edition = "2021"
rust-version = "1.77.2"

# Bibliotekets namn används av main.rs (och av mobil-entrypoint i framtiden).
[lib]
name = "property_empire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mindre, snabbare release-binär (bra för Steam-nedladdning).
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
